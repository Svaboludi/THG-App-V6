name: Build THG APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web App & Capacitor
        run: |
          mkdir -p www
          unzip -o THG-Arbeitsnachweis*.zip -d www
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "THG" "de.thg.arbeitsnachweis" --web-dir www
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            cp www/icon-512.png "$dir/ic_launcher.png"
            cp www/icon-512.png "$dir/ic_launcher_round.png"
          done
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THG-Arbeitsnachweis-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
